<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigia TV</title>
<link rel="icon" href="/icone.svg">
<style>
/* Vigia TV: os canais de notícia de cada país, ao vivo (transmissão oficial no YouTube). Mesmas cores do Vigia: verde = normal, âmbar = atenção.
   Sem animação: a página só mexe quando você troca de canal; a hora dos países atualiza uma vez por minuto. */
:root{
  --bg:#04150C;--card:#102118;--line:#21382C;--line-hi:#365243;
  --txt:#F8FCFA;--txt2:#CDDFD5;--mut:#98B4A5;--dim:#688776;--apagado:#4A6657;
  --green:#22C55E;--green-hi:#4ADE80;--amber:#F59E0B;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --tech:Bahnschrift,"Segoe UI",sans-serif;--mono:Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr);overflow:hidden;color:var(--txt);font:14px/1.4 var(--font);
  background:radial-gradient(ellipse 70% 80% at 38% 48%,#05170D 0%,#030D08 62%,#020805 100%)}
button{font:inherit;color:inherit}
kbd{font:700 10.5px/1 var(--mono);letter-spacing:.04em}

.topo{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:15px 24px 13px;border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:9px;font:800 17px/1 var(--font-d);letter-spacing:.16em;color:#DCFCE7;text-shadow:0 0 12px rgba(74,222,128,.45);white-space:nowrap}
.marca i{width:9px;height:9px;border-radius:50%;background:var(--green-hi);box-shadow:0 0 10px var(--green-hi)}
.marca span{color:var(--green-hi)}
#agora{flex:1;min-width:0;font:12.5px/1.3 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#agora b{color:var(--green-hi)}
#agora em{font-style:normal;color:var(--mut)}
#utc{font:600 15px/1 var(--tech);color:var(--green-hi);letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(74,222,128,.5);white-space:nowrap}

main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px 18px 16px 24px;gap:12px}
.palco{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.tela{position:relative;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;border:1px solid rgba(74,222,128,.35);border-radius:12px;overflow:hidden;background:#010604;
  box-shadow:0 0 30px -8px rgba(34,197,94,.4),0 20px 50px rgba(0,0,0,.6)}
.tela iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.recado{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,#04150C 0%,#010604 75%)}
.recado[hidden]{display:none}
.recado b{font:800 20px/1.25 var(--font-d);letter-spacing:.03em;color:#ECFDF5}
.recado p{margin:0;max-width:560px;font:13px/1.5 var(--mono);color:var(--mut)}
.recado.atencao b{color:#FCD34D}
.recado .acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.som{position:absolute;top:12px;left:12px;z-index:2;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(74,222,128,.7);background:rgba(2,12,7,.92);color:#DCFCE7;font:700 13px/1 var(--font);box-shadow:0 0 16px rgba(34,197,94,.35)}
.som:hover{background:rgba(22,60,36,.95)}
.som[hidden]{display:none}

.info{display:flex;align-items:center;gap:14px;min-height:44px}
.info .txt{flex:1;min-width:0}
.vivo{display:inline-flex;align-items:center;gap:7px;margin-right:9px;padding:3px 8px;border-radius:6px;border:1px solid rgba(74,222,128,.45);color:var(--green-hi);font:700 11px/1 var(--mono);letter-spacing:.1em;vertical-align:1px}
.vivo i{width:7px;height:7px;border-radius:50%;background:var(--green-hi);box-shadow:0 0 8px var(--green-hi)}
.vivo.nao{border-color:var(--line-hi);color:var(--dim)}
.vivo.nao i{background:var(--dim);box-shadow:none}
#titulo{font:600 15px/1.3 var(--font);color:#ECFDF5}
#detalhes{display:block;margin-top:4px;font:11.5px/1.3 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;cursor:pointer;white-space:nowrap;
  border:1px solid rgba(74,222,128,.32);background:rgba(4,22,12,.86);color:#BBF7D0;font:700 12.5px/1 var(--font);transition:border-color .18s,background .18s}
.bt:hover{border-color:rgba(74,222,128,.75);background:rgba(10,40,22,.9)}
.bt[hidden]{display:none}
.bt:focus-visible,.c:focus-visible,.busca:focus-visible{outline:2px solid var(--green-hi);outline-offset:2px}

aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(4,16,10,.75),rgba(1,7,4,.85))}
.cab{padding:14px 16px 10px}
.cab h3{margin:0 0 9px 2px;font:700 11px/1 var(--mono);letter-spacing:.16em;color:var(--apagado)}
.busca{display:block;width:100%;height:34px;padding:0 11px;border-radius:9px;border:1px solid rgba(74,222,128,.28);background:rgba(3,14,8,.82);color:#ECFDF5;font:12.5px/1 var(--mono)}
.busca::placeholder{color:var(--apagado)}
.busca:focus{outline:none;border-color:rgba(74,222,128,.8);box-shadow:0 0 0 3px rgba(74,222,128,.14)}
#lista{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px 14px;scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
#lista h4{margin:14px 0 6px 4px;font:700 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--apagado)}
.pais{padding:7px 6px 8px;border-radius:9px}
.pais.atual{background:rgba(74,222,128,.07)}
.pn{display:flex;align-items:baseline;gap:8px;margin:0 0 6px 2px;font:600 13px/1.2 var(--font);color:var(--txt2);cursor:pointer}
.pn kbd{color:var(--green-hi)}
.pn em{margin-left:auto;font:normal 10.5px/1 var(--mono);color:var(--apagado)}
.cs{display:flex;flex-wrap:wrap;gap:5px}
.c{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 9px;border-radius:7px;cursor:pointer;border:1px solid var(--line-hi);background:rgba(3,14,8,.7);color:var(--txt2);font:600 12px/1 var(--font)}
.c small{font:700 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.05em}
.c:hover{border-color:rgba(74,222,128,.6)}
.c.on{border-color:var(--green-hi);background:rgba(34,197,94,.18);color:#ECFDF5;box-shadow:0 0 10px rgba(74,222,128,.25)}
.c.on small{color:#86EFAC}
.c.fora{color:var(--dim);border-style:dashed}
.c.pt small{color:#86EFAC}
.vazio{margin:20px 6px;font:12px/1.5 var(--mono);color:var(--dim)}
.rodape{padding:10px 16px 13px;border-top:1px solid var(--line);font:11px/1.6 var(--mono);color:#3F6B52}
.rodape kbd{color:var(--dim)}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}aside{border-left:0;border-top:1px solid var(--line)}main{padding:14px 16px}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca"><i></i>VIGIA GLOBAL · <span>TV AO VIVO</span></div>
  <div id="agora">escolha um país na lista</div>
  <span id="utc">UTC --:--</span>
</header>
<main>
  <div class="palco">
    <div class="tela" id="tela">
      <button type="button" class="som" id="somBtn" hidden title="O navegador só deixa começar com som depois de um clique nesta janela (tecla M)">🔊 Ligar o som</button>
      <div class="recado" id="recado"><b>Carregando a lista de canais…</b></div>
    </div>
  </div>
  <div class="info">
    <div class="txt"><span class="vivo nao" id="vivoTag"><i></i>—</span><span id="titulo"></span><small id="detalhes"></small></div>
    <button type="button" class="bt" id="ytBtn" hidden title="Abre este ao vivo no YouTube, no Brave">↗ Abrir no YouTube</button>
  </div>
</main>
<aside aria-label="Canais por país">
  <div class="cab"><h3>JORNAIS DO MUNDO · AO VIVO</h3><input class="busca" id="busca" placeholder="Buscar país ou canal…" autocomplete="off" spellcheck="false" aria-label="Buscar país ou canal"></div>
  <div id="lista"></div>
  <div class="rodape"><kbd>↑</kbd> <kbd>↓</kbd> outro país · <kbd>←</kbd> <kbd>→</kbd> outra emissora<br><kbd>M</kbd> som · <kbd>/</kbd> buscar · só transmissões oficiais</div>
</aside>
<script>
'use strict';
// fuso da capital (para mostrar que horas são lá: de madrugada quase todo canal está em reprise)
const FUSO = { BR: 'America/Sao_Paulo', US: 'America/New_York', CA: 'America/Toronto', MX: 'America/Mexico_City', AR: 'America/Argentina/Buenos_Aires', CO: 'America/Bogota',
  PE: 'America/Lima', VE: 'America/Caracas', GB: 'Europe/London', FR: 'Europe/Paris', DE: 'Europe/Berlin', ES: 'Europe/Madrid', PL: 'Europe/Warsaw', UA: 'Europe/Kyiv',
  TR: 'Europe/Istanbul', VA: 'Europe/Rome', QA: 'Asia/Qatar', SA: 'Asia/Riyadh', AE: 'Asia/Dubai', IL: 'Asia/Jerusalem', IR: 'Asia/Tehran', EG: 'Africa/Cairo',
  NG: 'Africa/Lagos', IN: 'Asia/Kolkata', PK: 'Asia/Karachi', BD: 'Asia/Dhaka', CN: 'Asia/Shanghai', JP: 'Asia/Tokyo', KR: 'Asia/Seoul', TW: 'Asia/Taipei',
  SG: 'Asia/Singapore', ID: 'Asia/Jakarta', PH: 'Asia/Manila', TH: 'Asia/Bangkok', AU: 'Australia/Sydney' };
const LINGUA = { pt: 'português', en: 'inglês', es: 'espanhol', fr: 'francês', de: 'alemão', it: 'italiano', pl: 'polonês', uk: 'ucraniano', tr: 'turco', ar: 'árabe',
  fa: 'persa', hi: 'híndi', ur: 'urdu', bn: 'bengali', ja: 'japonês', ko: 'coreano', zh: 'chinês', id: 'indonésio', th: 'tailandês' };
const PLAYER = 'https://www.youtube-nocookie.com';
const $ = id => document.getElementById(id);
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

const relogios = new Map();
function horaLa(p) {
  const tz = FUSO[p]; if (!tz) return '';
  try {
    if (!relogios.has(tz)) relogios.set(tz, new Intl.DateTimeFormat('pt-BR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }));
    const t = relogios.get(tz).format(new Date()), h = +t.slice(0, 2);
    return { t, periodo: h < 6 ? 'madrugada' : h < 12 ? 'manhã' : h < 18 ? 'tarde' : 'noite' };
  } catch { return ''; }
}

let paises = [], porId = new Map(), atual = null, seq = 0, fr = null, video = null, mudo = true, querSom = true;
const recado = $('recado'), somBtn = $('somBtn'), ytBtn = $('ytBtn');

function mostrarRecado(titulo, texto, acoes, atencao) {
  recado.replaceChildren(el('b', '', titulo));
  if (texto) recado.append(el('p', '', texto));
  if (acoes && acoes.length) { const a = el('div', 'acoes'); a.append(...acoes); recado.append(a); }
  recado.classList.toggle('atencao', !!atencao); recado.hidden = false;
}
function botao(txt, fn, titulo) { const b = el('button', 'bt', txt); b.type = 'button'; b.onclick = fn; if (titulo) b.title = titulo; return b; }

// ---------- a lista ----------
function montarLista() {
  const q = semAcento($('busca').value), box = $('lista'); box.replaceChildren();
  let regiao = '', algum = false;
  for (const x of paises) {
    const bate = !q || semAcento(x.nome).includes(q) || x.p.toLowerCase() === q || x.canais.some(c => semAcento(c.nome).includes(q));
    if (!bate) continue;
    algum = true;
    if (x.regiao !== regiao) { regiao = x.regiao; box.append(el('h4', '', regiao.toUpperCase())); }
    const d = el('div', 'pais'); d.dataset.p = x.p;
    const pn = el('div', 'pn'); pn.append(el('kbd', '', x.p), x.nome);
    const h = horaLa(x.p); if (h) { const em = el('em', 'hora', h.t); em.dataset.p = x.p; pn.append(em); }
    pn.title = `Assistir ${x.canais[0].nome}`; pn.onclick = () => tocar(x.canais[0].id);
    const cs = el('div', 'cs');
    for (const c of x.canais) {
      const b = el('button', 'c' + (c.lingua === 'pt' ? ' pt' : '')); b.type = 'button'; b.dataset.id = c.id;
      b.append(c.nome, el('small', '', c.lingua.toUpperCase()));
      b.title = `${c.nome} · em ${LINGUA[c.lingua] || c.lingua}`;
      b.onclick = () => tocar(c.id);
      cs.append(b);
    }
    d.append(pn, cs); box.append(d);
  }
  if (!algum) box.append(el('div', 'vazio', 'Nenhum país ou canal com esse nome. Esta lista só tem as emissoras com ao vivo oficial e aberto.'));
  pintarLista();
}
function pintarLista() {
  for (const b of document.querySelectorAll('.c')) {
    const c = porId.get(b.dataset.id);
    b.classList.toggle('on', !!atual && atual.id === b.dataset.id);
    b.classList.toggle('fora', c.aoVivo === false);
    if (c.aoVivo === false) b.title = `${c.nome} · fora do ar agora`;
  }
  for (const d of document.querySelectorAll('.pais')) d.classList.toggle('atual', !!atual && atual.p === d.dataset.p);
}

// ---------- o player ----------
function tirarPlayer() { if (fr) { fr.remove(); fr = null; } video = null; somBtn.hidden = true; ytBtn.hidden = true; }
function pintarInfo(c, d) {
  const x = paises.find(y => y.p === c.p), h = horaLa(c.p);
  const tag = $('vivoTag'); tag.className = 'vivo' + (d && d.aoVivo ? '' : ' nao'); tag.lastChild.textContent = d && d.aoVivo ? 'AO VIVO' : d ? 'FORA DO AR' : '…';
  $('titulo').textContent = d && d.aoVivo ? d.titulo : c.nome;
  const partes = [c.nome, 'em ' + (LINGUA[c.lingua] || c.lingua)];
  if (d && d.vendo) partes.push(d.vendo.toLocaleString('pt-BR') + ' assistindo agora');
  if (h) partes.push(`lá são ${h.t} (${h.periodo})`);
  $('detalhes').textContent = partes.join(' · ');
  const ag = $('agora'); ag.replaceChildren(el('b', '', `[${c.p}] ${x ? x.nome : ''}`), ' · ', el('em', '', c.nome));
  document.title = `${c.nome} · Vigia TV`;
}
async function tocar(id, deNovo) {
  const c = porId.get(id); if (!c) return;
  const minha = ++seq;
  atual = c; tirarPlayer(); pintarLista(); pintarInfo(c, null);
  try { localStorage.setItem('vigia.tv', id); } catch { }
  history.replaceState(null, '', '#' + id);
  const linha = document.querySelector(`.c[data-id="${id}"]`); if (linha) linha.scrollIntoView({ block: 'nearest' });
  mostrarRecado(`Procurando o ao vivo da ${c.nome}…`, 'o motor do Vigia pergunta ao YouTube qual transmissão está no ar agora');
  let d = null;
  try { const r = await fetch(`/api/tv/aovivo?c=${encodeURIComponent(id)}${deNovo ? '&denovo=1' : ''}`); d = await r.json(); } catch { }
  if (minha !== seq) return;                       // já trocou de canal
  if (!d) return mostrarRecado('O motor do Vigia não respondeu', 'Abra o Vigia pelo atalho e tente de novo.', [botao('⟳ Tentar de novo', () => tocar(id))], true);
  c.aoVivo = !!d.aoVivo; pintarLista(); pintarInfo(c, d);
  const x = paises.find(y => y.p === c.p), outros = x.canais.filter(o => o.id !== id && o.aoVivo !== false);
  const alternativas = outros.map(o => botao('▶ ' + o.nome, () => tocar(o.id)));
  if (d.erro) return mostrarRecado('Não consegui falar com o YouTube', d.motivo, [botao('⟳ Tentar de novo', () => tocar(id, true)), ...alternativas], true);
  if (!d.aoVivo) return mostrarRecado(`${c.nome} está fora do ar agora`, outros.length ? 'Outras emissoras do país:' : 'Escolha outro país na lista ao lado.', alternativas, true);
  video = d.videoId; ytBtn.hidden = false;
  if (d.embed === false) return mostrarRecado(`${c.nome} não deixa assistir fora do YouTube`, 'A transmissão está no ar, mas só abre no próprio YouTube.', [botao('↗ Abrir no YouTube', abrirNoYouTube), ...alternativas], true);
  // o navegador só deixa começar com som depois de um clique nesta janela; antes disso começa mudo e mostra o botão de som
  const comSom = querSom && !!(navigator.userActivation && navigator.userActivation.hasBeenActive);
  mudo = !comSom;
  fr = el('iframe');
  fr.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; fr.allowFullscreen = true;
  fr.referrerPolicy = 'strict-origin-when-cross-origin'; fr.title = `${c.nome} ao vivo`;
  fr.src = `${PLAYER}/embed/${encodeURIComponent(video)}?autoplay=1&mute=${mudo ? 1 : 0}&playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  fr.onload = () => { escutar(); setTimeout(escutar, 1500); };
  $('tela').append(fr); recado.hidden = true; somBtn.hidden = !mudo;
}
// conversa com o player (o mesmo canal de mensagens que o YouTube usa nos sites)
function escutar() { if (fr) fr.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), PLAYER); }
function comando(func, args) { if (fr) fr.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [], id: 1, channel: 'widget' }), PLAYER); }
addEventListener('message', ev => {
  if (!fr || ev.source !== fr.contentWindow || ev.origin !== PLAYER) return;
  let d; try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch { return; }
  if (!d || !atual) return;
  if (d.event === 'onError') {
    const c = atual; tirarPlayer(); ytBtn.hidden = !video;
    mostrarRecado(`A transmissão da ${c.nome} não abriu aqui`, `O YouTube recusou (código ${d.info}). Dá para assistir no próprio YouTube.`, [botao('↗ Abrir no YouTube', abrirNoYouTube), botao('⟳ Tentar de novo', () => tocar(c.id, true))], true);
  } else if (d.event === 'infoDelivery' && d.info) {
    if ('muted' in d.info) { mudo = !!d.info.muted; somBtn.hidden = !mudo; }
    if (d.info.playerState === 0) {             // a transmissão terminou
      const c = atual; tirarPlayer();
      mostrarRecado(`A transmissão da ${c.nome} terminou`, 'Às vezes o canal começa outra logo em seguida.', [botao('⟳ Procurar de novo', () => tocar(c.id, true))]);
    }
  }
});
function alternarSom() {
  if (!fr) return;
  if (mudo) { comando('unMute'); querSom = true; mudo = false; } else { comando('mute'); querSom = false; mudo = true; }
  somBtn.hidden = !mudo;
}
somBtn.onclick = alternarSom;
async function abrirNoYouTube() {
  if (!video) return;
  const link = 'https://www.youtube.com/watch?v=' + video;
  let r = null;
  try { r = await fetch('/api/abrir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ link }) }); } catch { }
  if (r && r.ok) { const c = atual; tirarPlayer(); ytBtn.hidden = false; mostrarRecado(`${c.nome} abriu no Brave`, 'Aqui o player parou, para não tocar dois ao mesmo tempo.', [botao('▶ Voltar a assistir aqui', () => tocar(c.id))]); }
  else window.open(link, '_blank', 'noopener');
}
ytBtn.onclick = abrirNoYouTube;

// ---------- teclas: ↑ ↓ país, ← → emissora, M som, / busca ----------
function visiveis() { return [...document.querySelectorAll('.pais')].map(d => paises.find(x => x.p === d.dataset.p)); }
addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
  const busca = $('busca');
  if (ev.target === busca) {
    if (ev.key === 'Enter') { const v = visiveis(); if (v.length) { busca.value = ''; montarLista(); busca.blur(); tocar(v[0].canais[0].id); } }
    else if (ev.key === 'Escape') { busca.value = ''; montarLista(); busca.blur(); }
    return;
  }
  if (ev.key === '/') { ev.preventDefault(); busca.focus(); return; }
  if (ev.code === 'KeyM') { alternarSom(); return; }
  if (!atual || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(ev.key)) return;
  ev.preventDefault();
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
    const cs = paises.find(x => x.p === atual.p).canais, i = cs.findIndex(c => c.id === atual.id);
    tocar(cs[(i + (ev.key === 'ArrowRight' ? 1 : cs.length - 1)) % cs.length].id);
  } else {
    const v = visiveis(); if (!v.length) return;
    const i = v.findIndex(x => x.p === atual.p), j = i < 0 ? 0 : (i + (ev.key === 'ArrowDown' ? 1 : v.length - 1)) % v.length;
    tocar(v[j].canais[0].id);
  }
});
$('busca').addEventListener('input', montarLista);

// ---------- de onde começar: #BR (país, vindo do globo), #UC… (canal), o último assistido ou o Brasil ----------
function escolherDoHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (porId.has(h)) { if (!atual || atual.id !== h) tocar(h); return true; }
  const x = paises.find(y => y.p === h.toUpperCase());
  if (x) { if (!atual || atual.p !== x.p) tocar(x.canais[0].id); return true; }
  return false;
}
addEventListener('hashchange', escolherDoHash);

// relógios: UTC no topo e a hora de cada país na lista, uma vez por minuto
function relogio() {
  const d = new Date(); $('utc').textContent = `UTC ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
  for (const em of document.querySelectorAll('em.hora')) { const h = horaLa(em.dataset.p); if (h) em.textContent = h.t; }
  if (atual) { const h = horaLa(atual.p), det = $('detalhes'); if (h) det.textContent = det.textContent.replace(/lá são \d\d:\d\d \([^)]*\)/, `lá são ${h.t} (${h.periodo})`); }
  setTimeout(relogio, 60000 - Date.now() % 60000 + 50);
}

(async () => {
  relogio();
  try { paises = (await (await fetch('/api/tv')).json()).paises; } catch { }
  if (!paises || !paises.length) return mostrarRecado('O motor do Vigia não respondeu', 'Abra o Vigia pelo atalho e recarregue esta janela (F5).', [botao('⟳ Recarregar', () => location.reload())], true);
  porId = new Map(paises.flatMap(x => x.canais.map(c => [c.id, Object.assign(c, { p: x.p })])));
  montarLista();
  if (escolherDoHash()) return;
  let ultimo = null; try { ultimo = localStorage.getItem('vigia.tv'); } catch { }
  tocar(porId.has(ultimo) ? ultimo : paises[0].canais[0].id);
})();
</script>
